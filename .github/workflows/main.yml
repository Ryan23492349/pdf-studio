name: Deploy PDF Studio to GitHub Pages

on:
  # 當推送到 main 或 master 分支時觸發
  push:
    branches: ["main", "master"]
  # 允許在 GitHub Actions 頁面手動觸發部署
  workflow_dispatch:

# 設定 GITHUB_TOKEN 的權限，以允許部署到 GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# 確保同一時間只有一個部署正在運行，但允許新的推播取消正在進行的運行
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 構建任務
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1 # 與您 package.json 中的 packageManager 版本保持一致

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # Vite 7 與 import.meta.dirname 需要 Node 20.11+
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # 對應 vite.config.ts 中的 outDir

  # 部署任務
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
